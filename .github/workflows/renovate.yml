name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Renovate operation
        type: choice
        default: dry-run
        options:
          - dry-run
          - run

permissions:
  contents: read

concurrency:
  group: renovate-resume
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    environment: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Renovate operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          RENOVATE_ENABLED: ${{ vars.RENOVATE_ENABLED }}
        run: |
          set -eu
          if [ "$RENOVATE_ENABLED" != true ] || { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$MODE" = dry-run ]; }; then
            echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
          fi
      - name: Run Renovate
        if: github.event_name == 'workflow_dispatch' || vars.RENOVATE_ENABLED == 'true'
        run: docker compose -f .config/compose.yaml run --build --rm renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: guesant/resume
          RENOVATE_USERNAME: guesant
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOW_SCRIPTS: 'false'
